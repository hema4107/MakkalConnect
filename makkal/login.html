
<!DOCTYPE html>
<html>
<head>
    <title>Login - MakkalConnect</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/style/login.css">
</head>

<body>

    

    <section class="login-box">

        <h1>Login</h1>

        <p>Welcome back to MakkalConnect</p>

        <form action="dashboard.html">

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>

        </form>

        <p>New user? <a href="signup.html">Create an account</a></p>

    </section>
    <script>
        if (user.role === "admin") {
    window.location.href = "/makkalconnect/admin.html";
} else {
    window.location.href = "/makkalconnect/dashboard.html";
}
    </script>

</body>
</html>
